name: CI

on:
  pull_request:
    branches: [main]
  # Manual runs only. `pull_request: main` already runs CI on every PR (advisory:
  # main is unprotected, so a red run flags a merge but doesn't block it).
  # Triggering on `push: main` would duplicate every merge's CI.
  workflow_dispatch:

# Cancel in-flight runs when a new commit lands on the same PR. Saves runner
# minutes when reviewers push edits quickly.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Shared install + cache priming. Downstream jobs reuse the cache via the
  # same key, so each gets a warm `~/.bun/install/cache` without paying the
  # download cost again.
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache bun install
        id: bun-cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

  # Defined in audit.yml, which also runs it daily on a schedule, so the PR
  # gate and the daily check can't drift apart. A job that calls a reusable
  # workflow can't set runs-on, timeout-minutes or steps; those live there.
  # No `needs: setup`: `bun audit` takes its package list from bun.lock alone
  # and ignores node_modules, so it gains nothing from the install cache that
  # job primes. On a cold Bun cache it and setup both download Bun, and the
  # later save logs a harmless "Unable to reserve cache" line.
  audit:
    permissions:
      contents: read
    uses: ./.github/workflows/audit.yml

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job-level, so only this job's token carries the extra scope. Declaring
    # `permissions` here REPLACES the workflow-level block, so `contents: read`
    # has to be repeated for checkout.
    #
    # `pull-requests: read` is required because gitleaks-action builds its scan
    # range by enumerating the PR's commits via
    # `GET /repos/{owner}/{repo}/pulls/{number}/commits`. While this repo was
    # public that was readable with `contents: read` alone; it went private on
    # 2026-08-30, and every run since has failed that call with
    # `403 Resource not accessible by integration` — i.e. the secret scan has
    # been broken, not passing, on every PR opened since. Confirmed by the run
    # history: 2026-08-22 pass, 2026-08-24 pass, 2026-09-16 fail, with this file
    # unchanged in between.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # fetch-depth: 0 — on pull_request gitleaks-action scans only the PR's own
      # commits (`<first>^..<last>`, --first-parent --no-merges), so the clone
      # must hold those commits and the first one's parent; the default depth-1
      # merge-ref checkout has neither. A manual workflow_dispatch run of CI
      # passes no range and scans the full history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for secrets
        # v3 (not v2): v2 declares node20. Node 20 was removed from hosted
        # runners on 2026-09-23, so node20 actions are force-run on Node 24 with
        # a deprecation warning. v3 is a Node 20 -> 24 bump with no input or
        # behaviour changes.
        #
        # No GITLEAKS_LICENSE needed: that is required only for repos owned by an
        # ORGANIZATION. hudsor01 is a User account, so the action runs free here.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        # No `with:` — the action declares no inputs (the old `config-path` was
        # ignored and only added a warning). gitleaks itself auto-loads
        # ./.gitleaks.toml: the built-in rules plus allowlists for the two
        # verified non-secrets (the public IndexNow protocol key, and a curl
        # example with no credential in it). Those are global `[[allowlists]]`,
        # which need gitleaks >= 8.25.0; the action installs 8.24.3 unless
        # GITLEAKS_VERSION says otherwise.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1

  quality:
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile

      - name: Vitest
        run: bun run test

      - name: Vitest (TZ matrix)
        run: bun run test:tz

  build:
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 10
    env:
      NODE_ENV: production
      # Sentry plugin no-ops cleanly without the auth token; production
      # source-map upload happens from the Vercel build, not from CI.
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile

      - name: Cache Next.js incremental build
        uses: actions/cache@v6
        with:
          path: .next/cache
          # Bust the cache when source files or deps change, but reuse it
          # across same-commit reruns and on dep-only changes.
          # NOT a brace pattern: @actions/glob compiles with `nobrace`, so
          # `src/**/*.{ts,tsx,js,jsx}` matches zero files and hashFiles returns ''.
          # The key then never varied with source changes — a stale .next/cache
          # could be restored across unrelated commits.
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.js', 'src/**/*.jsx', 'next.config.js') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            nextjs-${{ runner.os }}-

      - name: Build
        run: bun run build

  # Playwright. This job did not exist until PR #238, which is precisely why a
  # spec that asserted a production-only CSP invariant sat permanently red
  # against the old `bun run dev` webServer without anyone noticing.
  #
  # Database: optional — the DB-backed routes degrade to empty states the specs
  # tolerate. The DB-dependent tests (count and per-spec breakdown live in
  # e2e/_helpers/database.ts) read real post cards or posts, or assert 404s for
  # a slug that must be absent from a populated table.
  # Those self-skip via e2e/_helpers/database.ts, which asks `/api/health`
  # whether the running server actually has a database rather than guessing.
  #
  # Set an `E2E_DATABASE_URL` secret (a dedicated Neon branch, seeded with
  # `bun run db:seed`) and those tests start running with no code change. Without it
  # they report as skipped, with the reason attached, rather than silently
  # vanishing from the run.
  #
  # Note this cannot be checked locally by unsetting the variable: `.env`,
  # `.env.local` and `.env.development.local` all carry a DATABASE_URL, and Next
  # loads `.env.local` + `.env` itself even for a production build, so
  # `env -u DATABASE_URL` proves nothing.
  # Sharded because `workers: 1` is Playwright's own CI recommendation and we keep
  # it: 588 tests run serially overran a 20-minute job on the first real CI run
  # (the build was not the problem — it compiled in 17 s). Playwright's documented
  # remedy for that is sharding across jobs rather than raising workers.
  # Each shard emits a blob report; `e2e-report` below merges them.
  e2e:
    runs-on: ubuntu-latest
    needs: setup
    # Per shard: 221 tests (884 in all) at 1 worker, plus browser download and one production
    # build. The full serial run was ~20 min, so a quarter of it has ample room.
    timeout-minutes: 20
    strategy:
      # Let every shard report rather than killing siblings on the first failure —
      # otherwise a single flake hides the rest of the suite's results.
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    # No job-level env on purpose: `next build` sets NODE_ENV=production for the
    # build itself, so this job needs none.
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile

      # Not cached on purpose. Playwright's CI guide says so outright: "Caching
      # browser binaries is not recommended, since the amount of time it takes to
      # restore the cache is comparable to the time it takes to download the
      # binaries." `--with-deps` also installs apt packages a cache cannot
      # restore. Three engines cover all four config projects — `mobile-chrome`
      # is the Pixel 5 descriptor running on the chromium binary.
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Cache Next.js incremental build
        uses: actions/cache@v6
        with:
          path: .next/cache
          # NOT a brace pattern: @actions/glob compiles with `nobrace`, so
          # `src/**/*.{ts,tsx,js,jsx}` matches zero files and hashFiles returns ''.
          # The key then never varied with source changes — a stale .next/cache
          # could be restored across unrelated commits.
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.js', 'src/**/*.jsx', 'next.config.js') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            nextjs-${{ runner.os }}-

      # Promote the secret to DATABASE_URL only when it is actually set. Mapping
      # it unconditionally would export DATABASE_URL="" when the secret is
      # absent, and env-validation.ts rejects an empty string outright
      # (`.min(1, 'DATABASE_URL is required')`) — that would break the build
      # instead of letting the DB-dependent tests skip.
      - name: Configure database (optional)
        env:
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
        run: |
          if [ -n "$E2E_DATABASE_URL" ]; then
            # Heredoc form, not `KEY=value`. A single-line write lets any
            # newline inside the secret start a second assignment, so a
            # malformed secret could define arbitrary env vars for every later
            # step. The delimiter is a fixed literal that cannot appear in a
            # Postgres URL. This is GitHub's documented multiline syntax.
            {
              echo "DATABASE_URL<<__E2E_DBURL_EOF__"
              printf '%s\n' "$E2E_DATABASE_URL"
              echo '__E2E_DBURL_EOF__'
            } >> "$GITHUB_ENV"
            echo "Database configured; DB-dependent specs will run."
          else
            echo "No E2E_DATABASE_URL secret set; the DB-dependent tests will skip."
          fi

      # One step, no manual backgrounding: playwright.config.ts's `webServer`
      # runs `bun run e2e:server` (build -> copy standalone assets -> start
      # .next/standalone/server.js on :3100), waits for readiness, and tears it
      # down afterwards. `reuseExistingServer` is false whenever CI is set, so
      # this always tests a freshly built server.
      - name: Playwright
        run: bunx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload blob report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          # Short: these are merged into the HTML report below and are useless
          # afterwards.
          retention-days: 1

  # Merges the four shards' blob reports into a single browsable HTML report.
  # `if: !cancelled()` so a failing shard still produces a report — that is
  # precisely when someone needs to read it.
  e2e-report:
    # `!cancelled()` alone drops the implicit success() gate on `needs`, so this
    # would also run when `e2e` was SKIPPED — with no blob artifacts to
    # download, `merge-reports` errors and posts a second, misleading red check.
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML report
        run: bunx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
