name: CI

on:
  pull_request:
    branches: [main]
  # Manual re-runs only — `pull_request: main` already gates merges.
  # Triggering on `push: main` would duplicate every merge's CI.
  workflow_dispatch:

# Cancel in-flight runs when a new commit lands on the same PR. Saves runner
# minutes when reviewers push edits quickly.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Shared install + cache priming. Downstream jobs reuse the cache via the
  # same key, so each gets a warm `~/.bun/install/cache` without paying the
  # download cost again.
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache bun install
        id: bun-cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

  audit:
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Audit dependencies
        run: bun audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job-level, so only this job's token carries the extra scope. Declaring
    # `permissions` here REPLACES the workflow-level block, so `contents: read`
    # has to be repeated for checkout.
    #
    # `pull-requests: read` is required because gitleaks-action builds its scan
    # range by enumerating the PR's commits via
    # `GET /repos/{owner}/{repo}/pulls/{number}/commits`. While this repo was
    # public that was readable with `contents: read` alone; it went private on
    # 2026-08-30, and every run since has failed that call with
    # `403 Resource not accessible by integration` — i.e. the secret scan has
    # been broken, not passing, on every PR opened since. Confirmed by the run
    # history: 2026-08-22 pass, 2026-08-24 pass, 2026-09-16 fail, with this file
    # unchanged in between.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # fetch-depth: 0 — the pre-commit hook only sees staged changes, so CI is
      # the only place full history is scanned. A shallow clone would silently
      # scan almost nothing and always pass.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        # v3 (not v2): v2 runs on Node 20, which GitHub stops supporting on
        # hosted runners after 2026-09-16 — a v2 pin would break this job within
        # weeks. v3 is a Node 20 -> 24 bump with no input or behaviour changes.
        #
        # No GITLEAKS_LICENSE needed: that is required only for repos owned by an
        # ORGANIZATION. hudsor01 is a User account, so the action runs free here.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Reads .gitleaks.toml, which extends the built-in rules and carries
          # the allowlist for the two verified non-secrets (the public IndexNow
          # protocol key, and a curl example with no credential in it).
          config-path: .gitleaks.toml

  quality:
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile

      - name: Vitest
        run: bun run test

  build:
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 10
    env:
      NODE_ENV: production
      SKIP_DB_VALIDATION: 'true'
      # Sentry plugin no-ops cleanly without the auth token; production
      # source-map upload happens from the Vercel build, not from CI.
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile

      - name: Cache Next.js incremental build
        uses: actions/cache@v4
        with:
          path: .next/cache
          # Bust the cache when source files or deps change, but reuse it
          # across same-commit reruns and on dep-only changes.
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**/*.{ts,tsx,js,jsx}') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            nextjs-${{ runner.os }}-

      - name: Build
        run: bun run build

  # Playwright. This job did not exist until PR #238, which is precisely why a
  # spec that asserted a production-only CSP invariant sat permanently red
  # against the old `bun run dev` webServer without anyone noticing.
  #
  # No DATABASE_URL, and no service container: measured, not assumed — the full
  # 588-test suite passes with the app both BUILT and SERVED with no database
  # (the DB-backed routes degrade to empty states the specs already tolerate).
  # If a future spec starts asserting on seeded blog content, that is the point
  # to add a dedicated Neon branch, not before.
  # Sharded because `workers: 1` is Playwright's own CI recommendation and we keep
  # it: 588 tests run serially overran a 20-minute job on the first real CI run
  # (the build was not the problem — it compiled in 17 s). Playwright's documented
  # remedy for that is sharding across jobs rather than raising workers.
  # Each shard emits a blob report; `e2e-report` below merges them.
  e2e:
    runs-on: ubuntu-latest
    needs: setup
    # Per shard: ~147 tests at 1 worker, plus browser download and one production
    # build. The full serial run was ~20 min, so a quarter of it has ample room.
    timeout-minutes: 20
    strategy:
      # Let every shard report rather than killing siblings on the first failure —
      # otherwise a single flake hides the rest of the suite's results.
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    # No job-level env on purpose. NODE_ENV is not set (unlike `build`) because
    # this job needs devDependencies present and `next build` sets it for the
    # build itself anyway; and SKIP_DB_VALIDATION is not set because it is dead
    # config — it appears only in this workflow and is read nowhere under src/.
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile

      # Not cached on purpose. Playwright's CI guide says so outright: "Caching
      # browser binaries is not recommended, since the amount of time it takes to
      # restore the cache is comparable to the time it takes to download the
      # binaries." `--with-deps` also installs apt packages a cache cannot
      # restore. Three engines cover all four config projects — `mobile-chrome`
      # is the Pixel 5 descriptor running on the chromium binary.
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Cache Next.js incremental build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**/*.{ts,tsx,js,jsx}') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            nextjs-${{ runner.os }}-

      # One step, no manual backgrounding: playwright.config.ts's `webServer`
      # runs `bun run e2e:server` (build -> copy standalone assets -> start
      # .next/standalone/server.js on :3100), waits for readiness, and tears it
      # down afterwards. `reuseExistingServer` is false whenever CI is set, so
      # this always tests a freshly built server.
      - name: Playwright
        run: bunx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload blob report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          # Short: these are merged into the HTML report below and are useless
          # afterwards.
          retention-days: 1

  # Merges the four shards' blob reports into a single browsable HTML report.
  # `if: !cancelled()` so a failing shard still produces a report — that is
  # precisely when someone needs to read it.
  e2e-report:
    if: ${{ !cancelled() }}
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML report
        run: bunx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
