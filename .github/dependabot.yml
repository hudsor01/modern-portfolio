version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned in both dependencies and overrides; Dependabot doesn't edit overrides.
      - dependency-name: postcss
