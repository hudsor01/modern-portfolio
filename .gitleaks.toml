# gitleaks configuration
#
# Extends the ~170 built-in rules rather than replacing them — `useDefault`
# keeps upstream rule updates flowing in instead of freezing a snapshot.
#
# Scanned in two places, matching the layering documented in lefthook.yml:
#   pre-commit  -> `gitleaks git --staged` (staged changes only, ~20ms)
#   CI          -> full history (authoritative; runs whether or not the hook did)

title = "modern-portfolio"

[extend]
useDefault = true

[allowlist]
description = "Verified non-secrets. Every entry must say WHY it is safe."

paths = [
  # IndexNow protocol keys are public BY DESIGN: ownership is proven by serving
  # the key at the domain root, so this file's NAME is the key and it must stay
  # world-readable. Confirmed live: GET /374957a2…5704.txt -> 200.
  # Not a leak; excluding the file stops it flagging on every commit.
  '''^public/[0-9a-f]{64}\.txt$''',

  # Built-in `curl-auth-header` false-positives here on a plain
  # `curl -X GET "http://localhost:3000/api/automation/health"` line that
  # carries no credential. Allowlisting this one path rather than overriding
  # the shipped rule, so the rule keeps working everywhere else. The file is
  # already deleted from the working tree; this only affects history scans.
  '''^BLOG_AUTOMATION_SYSTEM\.md$''',
]

regexes = [
  # Same IndexNow key, as referenced in planning/docs markdown. Public for the
  # reason above — documenting it discloses nothing the domain root doesn't.
  '''374957a2e557ab0eed4b0a1e6aacf8bd9db22b8fdfd75a9ca78df521394c5704''',
]
